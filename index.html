<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おしろぐ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- メイン画面表示エリア（app.jsで中身を描画） -->
  <main id="app-main" class="app-main"></main>

  <!-- 共通モーダル・引き出し表示エリア（app.jsで中身を描画） -->
  <div id="app-modal" class="app-modal hidden"></div>

  <!-- 下部タブナビゲーション（スライドする着色円インジケーター付き） -->
  <nav id="tab-bar" class="tab-bar">
    <!-- 選択中のタブに合わせてスライドする丸い出っ張り -->
    <div id="tab-indicator" class="tab-indicator"></div>

    <!-- バンク：マリオ風コイン -->
    <button type="button" class="tab-btn" data-tab="bank" data-index="0">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
      </svg>
      <span class="tab-label">バンク</span>
    </button>

    <!-- ログ：アルバム -->
    <button type="button" class="tab-btn" data-tab="log" data-index="1">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="3"></rect>
        <path d="M8 3v18"></path>
        <path d="M14.5 9.5a2 2 0 0 1 2.8 0c.8.8.8 2 0 2.8L14.5 15l-2.8-2.7a2 2 0 0 1 0-2.8 2 2 0 0 1 2.8 0z"></path>
      </svg>
      <span class="tab-label">ログ</span>
    </button>

    <!-- ホーム：家 -->
    <button type="button" class="tab-btn active" data-tab="home" data-index="2">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5 9.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9.5"></path>
        <path d="M9.5 21v-6a2.5 2.5 0 0 1 5 0v6"></path>
      </svg>
      <span class="tab-label">ホーム</span>
    </button>

    <!-- プラン：カレンダー -->
    <button type="button" class="tab-btn" data-tab="plan" data-index="3">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="17" rx="3"></rect>
        <path d="M8 2v4"></path>
        <path d="M16 2v4"></path>
        <path d="M3 10h18"></path>
        <circle cx="8.5" cy="14.5" r="1" fill="currentColor"></circle>
        <circle cx="12" cy="14.5" r="1" fill="currentColor"></circle>
        <circle cx="15.5" cy="14.5" r="1" fill="currentColor"></circle>
      </svg>
      <span class="tab-label">プラン</span>
    </button>

    <!-- システム：キラキラ -->
    <button type="button" class="tab-btn" data-tab="system" data-index="4">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"></path>
        <path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"></path>
      </svg>
      <span class="tab-label">システム</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
